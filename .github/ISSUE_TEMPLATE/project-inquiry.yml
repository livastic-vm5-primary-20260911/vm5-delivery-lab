name: "Request a scoped software project"
description: "Public, no-cost inquiry for an API check, Python/Node automation, or agent-ready prototype. Do not include secrets."
title: "[Project inquiry] "
labels: ["inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for considering VM5 Delivery Lab. This is a **public GitHub issue**, not a paid order.
        Do not share API keys, passwords, private repository contents, customer data, private financial information, or sensitive files.
        An initial scope and quote are free. Pricing/timing require written agreement before paid work begins.
  - type: dropdown
    id: service
    attributes:
      label: Requested service
      options:
        - API Reliability Check (indicative from $79)
        - Automation Microbuild (indicative from $149)
        - API + Agent Prototype (indicative from $399)
        - Other scoped software task
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: State the user-visible problem, desired outcome, and constraints without sharing confidential information.
      placeholder: "We need to validate CSV input and generate a specific report from public sample data."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will you know it works?
      description: Describe at least one observable acceptance criterion or a permitted reproduction scenario.
      placeholder: "Given sample A, output B should match the attached public expected-output example."
    validations:
      required: true
  - type: input
    id: public-reference
    attributes:
      label: Public reference or example (optional)
      description: A public, permitted repository or issue URL. Do not provide private links or authentication tokens.
      placeholder: "https://github.com/..."
    validations:
      required: false
  - type: dropdown
    id: budget
    attributes:
      label: Expected budget
      options:
        - Under $100 USD
        - $100–$250 USD
        - $250–$500 USD
        - $500–$1,000 USD
        - Please suggest a fixed quote
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: Preferred time frame (not a confirmed delivery commitment)
      options:
        - Flexible
        - Within 1 week if feasible
        - Within 2–4 weeks
        - Other - explain in the issue
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Safety and expectations
      options:
        - label: "I understand this issue is public and will not post secrets, private data, passwords, or confidential files."
          required: true
        - label: "I understand this is an inquiry, not a purchase. No payment or delivery is promised until we agree on scope and terms."
          required: true
